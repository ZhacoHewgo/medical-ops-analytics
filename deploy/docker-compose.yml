services:
  mysql:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    command: ["--skip-log-bin"]
    environment:
      MYSQL_DATABASE: hospital_test
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
    tmpfs:
      - /var/lib/mysql:size=1g
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql --protocol=socket -uroot --database=hospital_test -Nse 'SELECT 1' >/dev/null 2>&1
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ${MOPS_BUILD_CONTEXT:?set a staged public-source directory}
      dockerfile: deploy/Dockerfile.backend
    environment:
      OUTPATIENT_DATA_PATH: /app/data/outpatient.json
    volumes:
      - type: bind
        source: ${MOPS_AGGREGATE_FILE:?set a private aggregate JSON path}
        target: /app/data/outpatient.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8765/health', timeout=2).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12

  frontend:
    build:
      context: ${MOPS_BUILD_CONTEXT:?set a staged public-source directory}
      dockerfile: deploy/Dockerfile.frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 4s
      retries: 12

  nginx:
    image: public.ecr.aws/docker/library/nginx@sha256:3bc3836dc0be3b811f238210360bf8e7ca8a2d0effdae46160bf1f3578710051
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - target: 8080
        published: "0"
        host_ip: "127.0.0.1"
        protocol: tcp
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 4s
      retries: 12

secrets:
  mysql_root_password:
    file: ${MOPS_MYSQL_SECRET_FILE:?set a private password file}
